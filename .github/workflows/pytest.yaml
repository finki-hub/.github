name: Reusable Pytest

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run commands in"
        type: string
        default: "."
      python-version:
        description: "Python version to install. When omitted, uv resolves the project version."
        type: string
        default: ""
      sync-args:
        description: "Additional arguments passed to uv sync"
        type: string
        default: "--locked"
      pytest-args:
        description: "Arguments passed to pytest"
        type: string
        default: "-q"
      require-cas-credentials:
        description: "Fail before tests when CAS credentials are unavailable"
        type: boolean
        default: false
    secrets:
      CAS_USERNAME:
        required: false
      CAS_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          checksum: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
          enable-cache: true

      - name: Set up Python
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          if [ -n "$PYTHON_VERSION" ]; then
            uv python install "$PYTHON_VERSION"
          else
            uv python install
          fi

      - name: Install Dependencies
        env:
          UV_SYNC_ARGS: ${{ inputs.sync-args }}
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import subprocess

          subprocess.run(["uv", "sync", *shlex.split(os.environ["UV_SYNC_ARGS"])], check=True)
          PY

      - name: Require CAS Credentials
        if: ${{ inputs.require-cas-credentials }}
        env:
          CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
          CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
        run: |
          if [ -z "$CAS_USERNAME" ] || [ -z "$CAS_PASSWORD" ]; then
            echo "::error::CAS credentials are required but unavailable."
            exit 1
          fi

      - name: Run Pytest
        env:
          CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
          CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import subprocess

          subprocess.run(
              [".venv/bin/pytest", *shlex.split(os.environ["PYTEST_ARGS"])],
              check=True,
          )
          PY
