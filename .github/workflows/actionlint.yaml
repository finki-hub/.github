name: Actionlint

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check Workflow Files
        uses: docker://rhysd/actionlint:latest
        with:
        # Actionlint 1.7.12 predates GitHub's concurrency.queue field.
          args: -color -ignore unexpected.*queue.*concurrency
