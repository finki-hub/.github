name: Reusable Dependabot

on:
  workflow_call:
    inputs:
      auto-merge-uv:
        description: "Automatically approve and merge uv dependency updates"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot Metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata

      - name: Approve and Enable Auto-Merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          (inputs.auto-merge-uv || steps.metadata.outputs.package-ecosystem != 'uv')
        run: |
          gh pr review --approve "$PR_URL" --body "Auto-approving Dependabot PR (minor/patch)."
          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: "${{ github.event.pull_request.html_url }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
