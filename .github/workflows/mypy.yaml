name: Reusable MyPy

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run MyPy in"
        type: string
        default: "."

permissions:
  contents: read

concurrency:
  group: mypy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: MyPy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.21
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Register MyPy problem matcher
        uses: finki-hub/.github/.github/actions/problem-matchers@main
        with:
          tool: mypy

      - name: Run MyPy
        run: |
          uv sync --locked --dev --no-install-project --no-build
          uv run --locked --no-sync --no-build mypy --show-column-numbers --no-color-output .
