name: Reusable Pytest with PostgreSQL

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run commands in"
        type: string
        default: "."
      python-version:
        description: "Python version to install. When omitted, uv resolves the project version."
        type: string
        default: ""
      postgres-image:
        description: "PostgreSQL container image"
        type: string
        default: "pgvector/pgvector:pg17"

permissions:
  contents: read

concurrency:
  group: pytest-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-postgres:
    name: Pytest with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: api_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          if [ -n "$PYTHON_VERSION" ]; then
            uv python install "$PYTHON_VERSION"
          else
            uv python install
          fi

      - name: Install Dependencies
        run: uv sync --locked --no-build

      - name: Run Pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_test
        run: uv run --locked --no-sync --no-build pytest tests/integration -q
