name: Reusable Ruff

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run Ruff in"
        type: string
        default: "."

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.21
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Linter
        run: |
          uv sync --locked --dev --no-install-project --no-build
          uv run --locked --no-sync --no-build ruff check --output-format=github .

      - name: Run Ruff Formatter
        run: uv run --locked --no-sync --no-build ruff format --check --diff .
